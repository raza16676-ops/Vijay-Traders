<!-- product.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Vijay Traders Cosmetics</title>
  <meta name="description" content="Explore product details, benefits, ingredients, and routine pairings at Vijay Traders." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/css/custom.css" />
</head>
<body class="bg-white text-[#222222] antialiased pb-20 sm:pb-0">

  <div id="global-header"></div>

  <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-12">
    <!-- Breadcrumbs -->
    <nav aria-label="Breadcrumb" class="text-xs text-neutral-500 mb-6">
      <ol class="flex items-center space-x-2 flex-wrap">
        <li><a href="index.html" class="hover:text-[#C62828]">Home</a></li>
        <li><span>/</span></li>
        <li><a id="pdp-breadcrumb-cat" href="collection.html" class="hover:text-[#C62828] capitalize">Skincare</a></li>
        <li><span>/</span></li>
        <li id="pdp-breadcrumb-title" class="text-[#222222] font-semibold truncate max-w-xs" aria-current="page">Product</li>
      </ol>
    </nav>

    <!-- Main Product Grid -->
    <div id="pdp-mount" class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12"></div>

    <!-- Related Products: Complete Your Routine -->
    <section class="mt-16 pt-12 border-t border-[#EAE4E4]" aria-labelledby="heading-related">
      <div class="flex items-end justify-between mb-8">
        <div>
          <span class="text-xs font-bold uppercase tracking-[0.2em] text-[#C62828]">Routine Pairing</span>
          <h2 id="heading-related" class="font-editorial text-3xl font-semibold text-[#222222] mt-1">
            You May Also Like
          </h2>
        </div>
        <a href="collection.html" class="text-xs font-bold uppercase tracking-widest text-[#C62828] hover:underline">
          View All &rarr;
        </a>
      </div>
      <div id="pdp-related-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-3.5 sm:gap-6"></div>
    </section>
  </main>

  <!-- Mobile Sticky Add to Bag Bar -->
  <div id="pdp-sticky-bar" class="sm:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-[#EAE4E4] p-3 z-30 flex items-center justify-between gap-3 shadow-lg">
    <div class="truncate">
      <p id="sticky-title" class="text-xs font-semibold text-[#222222] truncate"></p>
      <p id="sticky-price" class="text-sm font-bold text-[#C62828]"></p>
    </div>
    <button
      type="button"
      id="sticky-add-btn"
      class="px-5 py-2.5 bg-[#C62828] text-white text-xs font-semibold uppercase tracking-widest rounded-sm shrink-0"
    >
      Add to Bag
    </button>
  </div>

  <div id="global-footer"></div>

  <script type="module" src="src/js/main.js"></script>
  <script type="module" src="src/js/product.js"></script>
</body>
</html>

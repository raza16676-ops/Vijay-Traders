<!-- brands.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brands Directory | Vijay Traders Cosmetics</title>
  <meta name="description" content="Explore all skincare and cosmetics brands carried by Vijay Traders." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="src/css/custom.css" />
</head>
<body class="bg-white text-[#222222] antialiased">

  <div id="global-header"></div>

  <main id="main-content" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    <header class="bg-[#FAF8F8] border border-[#EAE4E4] rounded-sm p-6 sm:p-10 mb-8 flex flex-col md:flex-row md:items-end justify-between gap-6">
      <div>
        <span class="text-xs font-bold uppercase tracking-[0.2em] text-[#C62828]">Partner Houses</span>
        <h1 class="font-editorial text-3xl sm:text-5xl font-semibold text-[#222222] mt-1">
          Brand Directory
        </h1>
        <p class="text-sm text-neutral-600 mt-2 max-w-2xl">
          Browse our configurable brand showcase. Placeholder slots are ready to be populated once Vijay Traders supplies the verified brand logo assets and confirms 18 vs. 25 active brands.
        </p>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button type="button" id="dir-btn-25" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider rounded-sm bg-[#C62828] text-white">
          25 Brands View
        </button>
        <button type="button" id="dir-btn-18" class="px-4 py-2 text-xs font-semibold uppercase tracking-wider rounded-sm bg-white border border-[#EAE4E4] text-[#222222]">
          18 Brands View
        </button>
      </div>
    </header>

    <div class="mb-6 max-w-md">
      <label for="brand-filter-input" class="sr-only">Filter brands by name</label>
      <input
        type="search"
        id="brand-filter-input"
        placeholder="Filter brands by name or category focus..."
        class="w-full px-4 py-2.5 text-sm border border-[#EAE4E4] rounded-sm focus:outline-none focus:border-[#C62828]"
      />
    </div>

    <div id="brands-directory-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
  </main>

  <div id="global-footer"></div>

  <script type="module" src="src/js/main.js"></script>
  <script type="module" src="src/js/brands-page.js"></script>
</body>
</html>
